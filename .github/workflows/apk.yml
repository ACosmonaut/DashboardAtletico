name: APK anteprima
on:
  push:
    branches: [apk-anteprima]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Atletico-anteprima
          path: android/Atletico-anteprima.apk
